name: Android CI & APK Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug, release, both)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

permissions:
  contents: read

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Secrets & Google Services
        run: |
          echo "Checking configuration files..."
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
            echo "Injected google-services.json from GitHub Secrets"
          elif [ -f "app/google-services.json" ]; then
            echo "Using existing app/google-services.json"
          else
            echo "Warning: app/google-services.json not found in repository. Using dummy template if needed."
          fi

      - name: Make Gradle Executable
        run: chmod +x gradlew || true

      - name: Run Unit & JVM Robolectric Tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Build Release APK and AAB
        if: ${{ (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both') && secrets.SIGNING_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          export KEYSTORE_PATH="$(pwd)/my-upload-key.jks"
          gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Verify Generated APKs
        run: |
          echo "================ BUILD OUTPUT VERIFICATION ================"
          mkdir -p build_artifacts
          if [ -d "app/build/outputs/apk/debug" ]; then
            echo "Found Debug APKs:"
            ls -la app/build/outputs/apk/debug/
            cp app/build/outputs/apk/debug/*.apk build_artifacts/ 2>/dev/null || true
          fi
          if [ -d "app/build/outputs/apk/release" ]; then
            echo "Found Release APKs:"
            ls -la app/build/outputs/apk/release/
            cp app/build/outputs/apk/release/*.apk build_artifacts/ 2>/dev/null || true
          fi
          if [ -d "app/build/outputs/bundle/release" ]; then
            echo "Found Release Bundles:"
            ls -la app/build/outputs/bundle/release/
            cp app/build/outputs/bundle/release/*.aab build_artifacts/ 2>/dev/null || true
          fi
          echo "Artifacts to upload:"
          ls -la build_artifacts/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        if: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
        with:
          name: jarvis-ai-release-bundle
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: app/build/reports/tests/
          if-no-files-found: ignore
